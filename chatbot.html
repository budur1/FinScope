<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FinScope AI Chatbot</title>
        <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="chatbot.css">  <!-- Link to the new CSS file -->
    </head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>كيف ممكن اساعدك اليوم؟</h2>
        </div>
        
        <div class="chat-box" id="chat-box">
           
        </div>
        
        <div class="suggested-questions">
            <button class="suggestion-btn" id="question1">ما أبرز النقاط في التقرير المالي السنوي لشركة "سابك" لعام 2024؟</button>
            <button class="suggestion-btn" id="question2">أعد تقريرًا تحليليًا عن أداء قطاع التجزئة في السوق السعودي خلال النصف الأول من عام 2024</button>
            <button class="suggestion-btn" id="question3">ما هي نسبة نمو الأرباح الصافية لشركة 'الاتصالات السعودية' في الربع الثالث مقارنة بالربع السابق؟</button>
        </div>
        
        <div class="user-input">
            <input type="text" id="user-input" placeholder="أكتب سؤالك هنا..." />
            <button id="send-btn" onclick="sendUserMessage()">إرسال</button>
        </div>
    </div>

    <script src="chatbot.js"></script>
</body>
</html>
